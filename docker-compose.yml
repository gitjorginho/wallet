version: '3.8'

services:
  # Servidor Web (Nginx) - Permite acessar o projeto pelo navegador em http://localhost:8080
  webserver:
    image: nginx:alpine
    container_name: wallet-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wallet-network
    depends_on:
      - app

  # Aplicação (PHP 8.4)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - wallet-network

  # Banco de Dados (MySQL)
  db:
    image: mysql:8.0
    container_name: wallet-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wallet_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: wallet_password
    ports:
      - "3306:3306"
    volumes:
      - wallet-db-data:/var/lib/mysql
    networks:
      - wallet-network

networks:
  wallet-network:
    driver: bridge

volumes:
  wallet-db-data:
